[project]
name = "mx"
#dynamic = ["version"]
version = '1.1.1.dev0+g7bc41952d.d20251211'
description = 'The Microsoft MX floating point library'
readme = "README.md"
requires-python = ">=3.8"
#dependencies = [
#    "torch>=2.1.0",
#    "torchvision",
#    "torchaudio"
#]
license = { file = "LICENSE" }
#keywords = ["mx", "floating point", "math", "mathematics", "machine learning", "deep learning", "artificial intelligence", "ai", "ml", "dl", "torch", "torchvision", "torchaudio"]
keywords = ["mx", "floating point", "math", "mathematics", "machine learning", "deep learning", "artificial intelligence", "ai", "ml", "dl"]
authors = [
  { name = "The Microsoft CAST Algorithms Team", email = "placeholder@microsoft.com" },
]

[build-system]
#requires = ["hatchling", "hatch-vcs", "pytest", "ninja", "wheel", "torch", "torchvision", "torchaudio"]
requires = ["hatchling", "hatch-vcs", "pytest", "ninja", "wheel"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/mx",
]


[tool.hatch.build.targets.wheel]
include = [
    "/mx",
]

#[tool.hatch.build.hooks.custom]
#path = "build.py"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "." }

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"